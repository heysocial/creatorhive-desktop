# "CreatorHive Preview": the team's build of 2.0 while it's being made. It installs
# beside the real app (its own bundle id and data) and updates from prereleases
# only, which the real app and the download page never see.
extends: ./electron-builder.yml
appId: com.creatorhive.desktop.preview
productName: CreatorHive Preview
# The app reads its own name to know it is the preview (src/main/config.js).
extraMetadata:
  productName: CreatorHive Preview
mac:
  icon: build/icon-preview.icns
  artifactName: CreatorHive-Preview-${version}-mac.${ext}
dmg:
  title: CreatorHive Preview
  artifactName: CreatorHive-Preview-${version}-mac.${ext}
publish:
  provider: github
  owner: heysocial
  repo: creatorhive-desktop
  releaseType: prerelease
  # Update file preview-mac.yml (electron-builder only infers alpha/beta channels).
  channel: preview
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png
  artifactName: CreatorHive-Preview-${version}-windows-${arch}.${ext}
  signAndEditExecutable: false
nsis:
  shortcutName: CreatorHive Preview
  uninstallDisplayName: CreatorHive Preview
