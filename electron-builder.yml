appId: com.creatorhive.desktop
productName: CreatorHive
copyright: Copyright © 2026 Hey Social Inc.
directories:
  output: dist
  buildResources: build
files:
  - src/**
  - assets/**
  - renderer/dist/**
  - package.json
# Electron fuses, flipped in the binary at build time (security audit, Oct 2026).
# Off: ELECTRON_RUN_AS_NODE, NODE_OPTIONS / NODE_EXTRA_CA_CERTS and --inspect,
# each of which lets anything on this Mac run code as the notarized app (with
# its microphone and camera permissions and its keychain item). On: the app
# loads only from app.asar, and macOS checks app.asar against the hash signed
# into the app. Cookie encryption is left as it was: turning it on is one-way,
# and the sign-in cookie must keep working across the update.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  category: public.app-category.social-networking
  icon: build/icon.icns
  target:
    - target: dmg
    - target: zip
  artifactName: CreatorHive-${version}-mac.${ext}
  minimumSystemVersion: "12.0"
  darkModeSupport: true
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: CreatorHive uses the microphone for voice memos and huddles.
    NSCameraUsageDescription: CreatorHive uses the camera for video in huddles and videos you send.
dmg:
  title: CreatorHive
  artifactName: CreatorHive-${version}-mac.${ext}
  contents:
    - { x: 140, y: 190 }
    - { x: 400, y: 190, type: link, path: /Applications }
publish:
  provider: github
  owner: heysocial
  repo: creatorhive-desktop
  releaseType: release
# Windows: an NSIS installer for x64 and arm64. Until a Windows code-signing
# certificate is added, the .exe is unsigned (Windows warns before installing)
# and its icon/metadata aren't stamped (that step needs signing or Wine).
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png
  artifactName: CreatorHive-${version}-windows-${arch}.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  shortcutName: CreatorHive
  uninstallDisplayName: CreatorHive
